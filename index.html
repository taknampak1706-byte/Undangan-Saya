if(o.type=='img')p+=`<label>Bentuk${SEL('shape',[['arch','Lengkung'],['oval','Oval'],['circle','Lingkaran'],['box','Kotak'],['free','Bebas (hiasan)']],o.shape)}</label><button data-a=rep class=pr>Ganti foto</button>`;
p+=`${RG('w',30,500,1,o.w,'Lebar / ukuran')}${SEL('anim',AI,o.anim).replace('<select','<label class=w2>Animasi masuk<select')+'</label>'}<label class=w2>Animasi gerak${SEL('loop',AL,o.loop)}</label>${RG('d',.2,4,.1,o.d,'Durasi')}${RG('dl',0,4,.1,o.dl,'Jeda')}<label>Tampilkan<input type=checkbox data-k=vis ${o.vis?'checked':''}></label></div><div class=row style="margin-top:8px"><button data-a=mv:-4,0>◀</button><button data-a=mv:0,-4>▲</button><button data-a=mv:0,4>▼</button><button data-a=mv:4,0>▶</button><button data-a=prev>Putar animasi</button><button data-a=dup>Gandakan</button><button data-a=del>Hapus</button></div>`}}
if(tab=='cover')p=`<div class=g><button data-a=addCT>+ Teks cover</button><button data-a=addCI>+ Gambar hiasan cover</button><button data-a=seal class=pr>Ganti gambar segel</button><button data-a=sealx>Segel awal</button>${RG('ss',50,160,1,S.ss,'Ukuran segel').replace('<input','<input data-s=1')}<button data-a=cimg>Gambar di kartu amplop</button><button data-a=cimgx>Hapus gambar kartu</button><button data-a=rp class=w2>Lihat ulang cover</button></div><p style="color:#bbb;font-size:11px">Sentuh teks atau gambar di cover untuk memilih, lalu geser atau atur di tab Elemen.</p>`;
if(tab=='add')p=`<div class=g><button data-a=addT>+ Teks baru</button><button data-a=addI>+ Foto dari galeri</button><button data-a=addD>+ Hiasan (gambar)</button><button data-a=addP>+ Halaman</button><button data-a=delP>− Halaman</button></div>`;
if(tab=='tema')p=`<div class=g>${Object.keys(TH).map(k=>`<button class=sw data-a=th:${k} style="background:${TH[k][1]}">${TH[k][0]}</button>`).join('')}</div><div class=g style="margin-top:10px"><label class=w2>Font untuk semua tulisan<select id=fa>${FO.map(x=>`<option>${x[0]}</option>`).join('')}</select></label><button data-a=fall class=pr>Terapkan ke semua</button><label>Latar halaman<select id=pgs>${Array.from({length:S.pages},(_,i)=>`<option value=${i}>Halaman ${i+1}</option>`)}</select></label><button data-a=pbg>Ganti latar</button><button data-a=pbgx>Hapus latar</button></div>`;
if(tab=='data'){const L=(k,l,t='text')=>`<label class=w2>${l}<input type=${t} data-s=1 data-k=${k} value="${esc(S[k]||'')}"></label>`;p=`<div class=g>${L('date','Tanggal hitung mundur','datetime-local')}${L('map','Link Google Maps (https://...)')}<label class=w2>Nama link undangan (huruf kecil, angka, tanda hubung)<input data-sl value="${esc(slug)}"></label><button data-a=cp class=w2>Salin link tamu</button><button data-a=mus>Tambah musik</button><button data-a=musx>Hapus musik</button></div><p style="color:#bbb;font-size:11px;word-break:break-all">Link tamu: ${esc(shareLink())}</p>`}
if(tab=='list')p=ALL().map(e=>`<div class=li><span data-a=pick:${e.id}>${e.text!=null?esc(e.text.slice(0,28)):e.type=='img'?'Gambar':'Hitung mundur'}</span><input type=checkbox data-a=vis:${e.id} ${e.vis?'checked':''}></div>`).join('');
ui.innerHTML=`<div id=top><button data-a=exit>✕ Keluar</button><button class=pr data-a=save>Simpan & Bagikan</button><button data-a=wa>WhatsApp</button></div><div class=pn><div class=tabs>${tabs}</div>${p}</div><input type=file id=f hidden>`}
function setEd(v){ed=v;document.body.classList.toggle('ed',v);if(v){cov.style.display='none';au.pause();UI()}else{cov.style.display='none';cov.classList.remove('sm');ui.innerHTML=fabHTML()+'<input type=file id=f hidden>'}render();if(!v)observe()}
const mv=(a)=>{const[x,y]=a.split(',').map(Number);sel.x+=x;sel.y+=y;render()};
async function act(a){const[k,v]=[a.split(':')[0],a.slice(a.indexOf(':')+1)];
if(k=='open')return open_();if(k=='edit'){cov.style.display='none';return setEd(true)}if(k=='exit')return setEd(false);
if(k=='mute'){au.paused?au.play():au.pause();return muteBtn()}
if(k=='tab'){tab=v;return UI()}
if(k=='addT'){const o=T('Teks baru',scrollY/(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u'))||1)+200,24,'Great Vibes');S.els.push(o);sel=o;tab='el'}
if(k=='addI'||k=='addD'){const src=await img(k=='addD'?700:1100),o=I(scrollY/(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u'))||1)+200,k=='addD'?120:200,k=='addD'?'free':'box');o.src=src;S.els.push(o);sel=o;tab='el'}
if(k=='addP')S.pages++;if(k=='delP'&&S.pages>1)S.pages--;
if(k=='rep'){sel.src=await img(1100)}
if(k=='del'){S.els=S.els.filter(e=>e!=sel);S.cels=S.cels.filter(e=>e!=sel);sel=null}if(k=='dup'){const c={...sel,id:id(),x:sel.x+12,y:sel.y+12};(S.cels.includes(sel)?S.cels:S.els).push(c);sel=c}
if(k=='addCT'){const o=T('Teks baru',300,26,'Great Vibes');S.cels.push(o);sel=o;tab='el'}
if(k=='addCI'){const o=I(300,120,'free');o.src=await img(700);S.cels.push(o);sel=o;tab='el'}
if(k=='seal'){S.seal=await img(400)}if(k=='sealx')S.seal=SEAL;if(k=='cimg'){S.cimg=await img(900)}if(k=='cimgx')S.cimg='';
if(k=='rp'){cov.classList.remove('op','sm');cov.style.display='block';setTimeout(()=>cov.classList.add('op'),500);setTimeout(()=>cov.classList.remove('op'),3600);return}
if(k=='mv')return mv(v);if(k=='prev'){const e=$('.el.sel .in');e.classList.add('pre');void e.offsetWidth;e.classList.remove('pre');return}
if(k=='th'){S.theme=v}if(k=='fall'){S.els.forEach(e=>{if(e.type=='text'||e.type=='map')e.font=$('#fa').value})}
if(k=='pbg'){S.pbg[$('#pgs').value]=await img(1000)}if(k=='pbgx'){delete S.pbg[$('#pgs').value]}
if(k=='mus'){const f=$('#f');f.accept='audio/*';f.onchange=()=>{const fl=f.files[0];if(!fl)return;if(fl.size>7e6){f.value='';return toast('Musik maksimal 7 MB')}const r=new FileReader();r.onload=()=>{S.music=r.result;draft();toast('Musik ditambahkan')};r.readAsDataURL(fl);f.value=''};f.click();return}
if(k=='musx')S.music='';
if(k=='pick'){sel=ALL().find(e=>e.id==v);tab='el'}if(k=='vis'){const e=ALL().find(e=>e.id==v);e.vis=e.vis?0:1;return render()}
if(k=='cp'){navigator.clipboard&&navigator.clipboard.writeText(shareLink());return toast('Link disalin')}
if(k=='wa')return window.open('https://wa.me/?text='+encodeURIComponent('Kami mengundang Anda ke pernikahan kami: '+shareLink()));
if(k=='save')return save();
render();UI()}
async function save(){try{toast('Menyimpan...');const A={},P=pack(JSON.parse(JSON.stringify(S)),A),ts=Date.now();
const r=await fetch(dbUrl+'undangan/'+slug+'.json',{method:'PUT',body:JSON.stringify({ts,s:P,a:A})});if(!r.ok)throw 0;
idb('set','pub:'+slug,{ts,S:S});idb('del','draft:'+slug);history.replaceState(null,'','?u='+slug+'#edit');
navigator.clipboard&&navigator.clipboard.writeText(shareLink());toast('Tersimpan. Link tamu disalin.')}catch(e){toast('Gagal menyimpan. Periksa aturan Firebase dan koneksi.')}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&t.type!='checkbox'){e.preventDefault();act(t.dataset.a)}else if(ed&&e.target.closest('.mp a'))e.preventDefault()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.a&&t.type=='checkbox')act(t.dataset.a)});
document.addEventListener('input',e=>{const t=e.target;if('sl' in t.dataset){slug=clean(t.value);return}const k=t.dataset.k;if(!k)return;const v=t.type=='checkbox'?(t.checked?1:0):t.type=='range'?+t.value:t.value;(t.dataset.s?S:sel)[k]=v;render()});
function pd(e){if(!ed)return;const el=e.target.closest('.el');if(!el)return;sel=ALL().find(o=>o.id==el.dataset.id);if(!sel)return;st={x:e.clientX,y:e.clientY,ox:sel.x,oy:sel.y};drag=el;el.setPointerCapture(e.pointerId);document.querySelectorAll('.el.sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');tab='el';UI()}
function pm(e){if(!drag)return;const u=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u'))*(cov.contains(drag)?.6:1);sel.x=st.ox+(e.clientX-st.x)/u;sel.y=st.oy+(e.clientY-st.y)/u;drag.style.left=`calc(var(--u)*${sel.x})`;drag.style.top=`calc(var(--u)*${sel.y})`;draft()}
[app,cov].forEach(x=>{x.addEventListener('pointerdown',pd);x.addEventListener('pointermove',pm);x.addEventListener('pointerup',()=>drag=null)});
(async()=>{
fit();addEventListener('resize',fit);
cov.innerHTML='<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#2d3a2b;font:14px sans-serif">Memuat...</div>';
let o=null,ts=0,own=0,bg=0;
if(can){const d=await idb('get','draft:'+slug);if(d){o=d.S;own=1}}
if(!o&&can){const r=await remote().catch(()=>0);if(r){o=r.S;ts=r.ts;idb('set','pub:'+slug,r)}}
if(!o){const c=await idb('get','pub:'+slug);if(c){o=c.S;ts=c.ts;bg=1}}
if(!o){const r=await remote().catch(()=>0);if(r){o=r.S;ts=r.ts;idb('set','pub:'+slug,r)}}
setS(o||{});render();cover();ui.innerHTML=fabHTML()+'<input type=file id=f hidden>';
if(own)toast('Draf terakhir dipulihkan');
if(bg)remote().then(r=>{if(r&&r.ts>ts){idb('set','pub:'+slug,r);if(!ed&&!cov.classList.contains('op')&&cov.style.display!='none'){setS(r.S);render();cover()}}}).catch(()=>{});
})();
</script></body></html>
